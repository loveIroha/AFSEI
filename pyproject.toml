[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afsei"
version = "0.1.0"
description = "AFSEI: electrophysiology, fluid and solid coupling on GPUs"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
io = ["meshio>=5", "matplotlib>=3.8"]
mesh = ["h5py>=3.10", "meshio>=5.3"]
reference = ["fenics-basix==0.10.0"]
quadrature = ["fenics-basix==0.10.0"]
geometry = ["gmsh==4.15.2", "meshio==5.3.5"]
fused = ["triton>=3.0; sys_platform == 'linux'"]
cuda-ib = ["ninja>=1.11"]

[tool.setuptools.package-data]
afsi_torch = ["mac/csrc/*.cpp", "mac/csrc/*.cu", "ep/csrc/*.cpp", "ep/csrc/*.cu", "ep/csrc/*.h", "ep/csrc/*.c"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
